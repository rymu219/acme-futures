[project]
name = "acme-futures"
version = "0.1.0"
description = "Futures-only algo-trading system targeting Topstep (Phase A)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "signalrcore>=0.9",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "supabase>=2.5",
    "python-dotenv>=1.0",
    "structlog>=24",
    "tenacity>=8",
    "databento>=0.77.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
    "streamlit>=1.57.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
